<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Annabey Run</title>
<style>
:root{--bg:#050711;--fg:#f4f1ea;--muted:#9ca1b3;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}#app{position:fixed;inset:0;background:#050711;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none;padding:max(20px,env(safe-area-inset-top)) 20px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#aeb3c4}.score{text-align:right}.score strong{display:block;font:500 25px/1 Georgia,serif;letter-spacing:.04em}.score small{color:#74798b;font-size:8px;letter-spacing:.2em}.meter{position:absolute;left:20px;right:20px;top:70px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,#9bb5ff,#d7b9ff);box-shadow:0 0 14px rgba(180,190,255,.6);transition:width .12s linear}.screen{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(50,66,110,.2),transparent 45%),rgba(3,5,12,.35);transition:opacity .45s,transform .45s}.screen.hidden{opacity:0;pointer-events:none;transform:scale(1.04);}.panel{max-width:420px}.eyebrow{font-size:9px;letter-spacing:.4em;color:#7f879d;text-transform:uppercase;margin-bottom:20px}.title{margin:0;font:400 clamp(48px,15vw,86px)/.85 Georgia,serif;letter-spacing:-.06em}.subtitle{margin:20px 0 28px;color:#a7acbc;font-size:14px;line-height:1.8}.cta{pointer-events:auto;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#f5f3ed;border-radius:999px;padding:14px 25px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(15px);transition:.25s}.cta:active{transform:scale(.96);background:rgba(255,255,255,.12)}.hint{margin-top:16px;color:#656b7e;font-size:9px;letter-spacing:.18em}.gameover h2{margin:0;font:400 48px/1 Georgia,serif}.result{margin:18px 0 26px;color:#aeb3c2;line-height:1.8}.new{color:#d8c8ff}.pause{position:absolute;right:20px;bottom:24px;pointer-events:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.22);color:#ddd;display:none}.playing .pause{display:block}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.hit{animation:flash .28s ease-out}@keyframes flash{0%{opacity:.22}100%{opacity:0}}@media(min-width:700px){.hud{padding-left:32px;padding-right:32px}.meter{left:32px;right:32px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas><div class="flash" id="flash"></div>
<div class="hud"><div class="top"><div class="brand">ANNABEY RUN</div><div class="score"><strong id="score">000000</strong><small>BEST <span id="best">000000</span></small></div></div><div class="meter"><i id="meter"></i></div><button class="pause" id="pause">Ⅱ</button></div>
<section class="screen" id="start"><div class="panel"><div class="eyebrow">A tiny world to get lost in</div><h1 class="title">Run.</h1><p class="subtitle">A little endless journey through clouds, stars and strange things.</p><button class="cta" id="startBtn">Start running</button><div class="hint">TAP / SPACE TO JUMP · DOUBLE TAP TO DASH</div></div></section>
<section class="screen hidden" id="gameover"><div class="panel"><div class="eyebrow">The journey pauses here</div><h2>One more run?</h2><div class="result">SCORE <b id="final">0</b><br><span class="new" id="newbest"></span></div><button class="cta" id="again">Run again</button></div></section>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id);let state='menu',last=0,time=0,score=0,best=+localStorage.getItem('annabeyBest')||0,speed=360,world=0,spawn=0,starSpawn=0,ground=0,shake=0,jumpHeld=false,lastTap=0;
$('best').textContent=String(best).padStart(6,'0');
const player={x:0,y:0,vy:0,w:42,h:52,onGround:true,dash:0};let obstacles=[],stars=[],particles=[],clouds=[];
function reset(){score=0;speed=360;world=0;spawn=.5;starSpawn=.8;shake=0;obstacles=[];stars=[];particles=[];player.y=0;player.vy=0;player.onGround=true;player.dash=0;for(let i=0;i<12;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*H*.42,s:.5+Math.random()*1.3});}
function start(){reset();state='play';$('start').classList.add('hidden');$('gameover').classList.add('hidden');$('app').classList.add('playing');last=performance.now();requestAnimationFrame(loop)}
function end(){state='over';$('app').classList.remove('playing');$('final').textContent=Math.floor(score);let nb=score>best;if(nb){best=Math.floor(score);localStorage.setItem('annabeyBest',best);$('best').textContent=String(best).padStart(6,'0');$('newbest').textContent='✦ NEW BEST ✦'}else $('newbest').textContent='';$('gameover').classList.remove('hidden');}
function jump(){if(state!=='play')return;const now=performance.now();if(now-lastTap<260&&player.dash<=0){player.dash=.38;for(let i=0;i<15;i++)burst(player.x+20,ground-player.y-25,'dash');}else if(player.onGround){player.vy=-720;player.onGround=false;for(let i=0;i<7;i++)burst(player.x+20,ground-player.y,'jump')}lastTap=now}
function burst(x,y,type){particles.push({x,y,vx:(Math.random()-.5)*(type==='dash'?360:100),vy:(Math.random()-.5)*150-30,life:.45+Math.random()*.35,max:.8,size:1+Math.random()*3,type})}
function spawnObstacle(){const type=Math.random()<.28?'rock':Math.random()<.52?'spike':'crystal';const h=type==='spike'?34:28+Math.random()*35;obstacles.push({x:W+50,w:type==='rock'?36:26+Math.random()*18,h,type})}
function spawnStar(){stars.push({x:W+40,y:ground-75-Math.random()*150,r:5+Math.random()*2,spin:Math.random()*6.28})}
function hit(a,b){return a.x<a.x+a.w&&a.x+a.w>b.x&&a.y-a.h<b.y&&a.y>b.y-b.h}
function update(dt){time+=dt;score+=dt*(speed/55);world=score/700;speed=Math.min(760,360+score*.028);ground=H*.78;player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y>=0){player.y=0;player.vy=0;player.onGround=true}if(player.dash>0)player.dash-=dt;spawn-=dt;if(spawn<=0){spawnObstacle();spawn=.85+Math.random()*.8-(speed-360)/1300}starSpawn-=dt;if(starSpawn<=0){spawnStar();starSpawn=.55+Math.random()*.8}for(const o of obstacles)o.x-=(speed+(player.dash>0?320:0))*dt;for(const s of stars){s.x-=(speed+(player.dash>0?320:0))*dt;s.spin+=dt*5}obstacles=obstacles.filter(o=>o.x>-100);stars=stars.filter(s=>s.x>-50);for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];const py=ground-player.y;const p={x:player.x+7,y:py,w:player.w-14,h:player.h-4};const b={x:o.x,y:ground,w:o.w,h:o.h};if(hit(p,b)){if(player.dash>0){for(let k=0;k<22;k++)burst(o.x+o.w/2,ground-o.h/2,'dash');obstacles.splice(i,1);score+=80}else{shake=14;$('flash').classList.remove('hit');void $('flash').offsetWidth;$('flash').classList.add('hit');end();return}}}for(let i=stars.length-1;i>=0;i--){const s=stars[i],dx=s.x-(player.x+20),dy=s.y-(ground-player.y-26);if(dx*dx+dy*dy<700){score+=35;for(let k=0;k<12;k++)burst(s.x,s.y,'star');stars.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;if(p.life<=0)particles.splice(i,1)}$('score').textContent=String(Math.floor(score)).padStart(6,'0');$('meter').style.width=(Math.min(1,(score%700)/700)*100)+'%';}
function draw(){const phase=world%4;const palettes=[['#07101d','#101c32'],['#15101c','#3a2639'],['#04050d','#121735'],['#08051a','#28134d']];const a=palettes[Math.floor(phase)],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a[0]);g.addColorStop(1,a[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars();drawClouds();const gy=ground;ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,gy+1);ctx.lineTo(W,gy+1);ctx.stroke();drawGround();for(const s of stars)drawStar(s);for(const o of obstacles)drawObstacle(o);drawPlayer();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.type==='dash'?'#b9c8ff':p.type==='star'?'#fff2b5':'#d9e0ff';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawStars(){const n=Math.floor(55+world*18);for(let i=0;i<n;i++){const x=(i*137.3+(time*(8+world*3)))%W,y=(i*83.7)% (ground*.75)+20;const tw=.25+.25*Math.sin(time*2+i);ctx.globalAlpha=tw;ctx.fillStyle='#dfe7ff';ctx.fillRect(x,y,1.2,1.2)}ctx.globalAlpha=1}
function drawClouds(){for(const c of clouds){c.x-=18*(1+c.s*.2)*(1+world*.12)*.016;if(c.x<-160)c.x=W+100;ctx.globalAlpha=.07+c.s*.03;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(c.x,c.y,70*c.s,22*c.s,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x+45*c.s,c.y-8*c.s,42*c.s,25*c.s,0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function drawGround(){ctx.strokeStyle='rgba(180,190,255,.09)';for(let x=-(time*speed*.25%70);x<W;x+=70){ctx.beginPath();ctx.moveTo(x,ground+20);ctx.lineTo(x+28,ground+20);ctx.stroke()}}
function drawStar(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.spin);ctx.shadowBlur=18;ctx.shadowColor='#fff0a8';ctx.fillStyle='#fff2b5';ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?2.3:7;const a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
function drawObstacle(o){ctx.save();ctx.translate(o.x,ground);ctx.shadowBlur=14;ctx.shadowColor='rgba(170,190,255,.12)';ctx.fillStyle=o.type==='crystal'?'#b9b7ff':o.type==='rock'?'#7e879e':'#d6c7ff';ctx.beginPath();if(o.type==='spike'){ctx.moveTo(0,0);ctx.lineTo(o.w/2,-o.h);ctx.lineTo(o.w,0)}else if(o.type==='crystal'){ctx.moveTo(2,0);ctx.lineTo(o.w*.25,-o.h);ctx.lineTo(o.w*.65,-o.h*.72);ctx.lineTo(o.w,0)}else{ctx.roundRect(0,-o.h,o.w,o.h,8)}ctx.fill();ctx.restore()}
function drawPlayer(){const x=player.x,y=ground-player.y-26;ctx.save();ctx.translate(x+21,y);if(player.dash>0){for(let i=1;i<5;i++){ctx.globalAlpha=.08*(5-i);ctx.fillStyle='#b8c7ff';ctx.beginPath();ctx.ellipse(-i*15,5,20,7,0,0,Math.PI*2);ctx.fill()}}ctx.shadowBlur=20;ctx.shadowColor='rgba(190,205,255,.35)';ctx.fillStyle='#f0eee7';ctx.beginPath();ctx.arc(0,-9,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#141827';ctx.beginPath();ctx.arc(-5,-11,2,0,Math.PI*2);ctx.arc(5,-11,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f0eee7';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,7);ctx.lineTo(-14,20+Math.sin(time*14)*3);ctx.moveTo(8,7);ctx.lineTo(14,20-Math.sin(time*14)*3);ctx.stroke();ctx.restore()}
function loop(now){if(state!=='play')return;const dt=Math.min(.032,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function togglePause(){if(state==='play'){state='pause';}else if(state==='pause'){state='play';last=performance.now();requestAnimationFrame(loop)}}
$('startBtn').onclick=start;$('again').onclick=start;$('pause').onclick=togglePause;addEventListener('pointerdown',e=>{if(state==='play'&&e.target.tagName!=='BUTTON')jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(state==='menu'||state==='over')start();else jump()}if(e.code==='KeyP')togglePause()});
function idle(){if(state==='menu'){time+=.016;draw()}requestAnimationFrame(idle)}idle();
</script></body></html>
