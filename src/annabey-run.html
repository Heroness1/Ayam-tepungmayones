<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jaktim Mart: Tebus Murah, Tebus Hati</title>
<style>
:root{--page:#120d1a;--paper:rgba(255,255,255,.96);--ink:#2a2233;--red:#e1251b;--blue:#1b4fa3;--gold:#ffc72c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#08060d;--paper:rgba(250,244,247,.97)}}
:root[data-theme=dark]{--page:#08060d;--paper:rgba(250,244,247,.97)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
#app{max-width:1000px;height:100%;margin:auto;display:flex;flex-direction:column}
#sw{position:relative;flex:1;min-height:0;display:flex;align-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#3a2a55,var(--page) 72%)}
#stage{width:100%;position:relative;overflow:hidden;transition:height .8s ease;background:linear-gradient(#1c2340,#3b2a52 65%,#120d1a);box-shadow:0 0 40px #000a}
#w{position:absolute;inset:0;transition:filter .9s}
#w img{position:absolute;left:0;top:0;width:1376px;height:572px;max-width:none;transform-origin:0 0;opacity:0;transition:transform 1s cubic-bezier(.3,.7,.2,1),opacity .6s}
#fx{position:absolute;inset:0;pointer-events:none;z-index:1}
#hud{position:absolute;top:10px;right:12px;z-index:2;background:#0008;color:#ff8fb0;border-radius:99px;padding:1px 14px;font-weight:800}
#ch,#sp,#ti,#en{position:absolute;inset:0;display:none;color:#fff;text-align:center}
#ch.on{display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto;background:#0a061499;z-index:3}
#ch button{background:#fff;color:var(--ink);border:2px solid var(--red);border-radius:14px;padding:12px 14px;font:600 clamp(14px,3.8vw,18px)/1.4 inherit;text-align:left;cursor:pointer}
#ch button:first-child{margin-top:auto}#ch button:last-child{margin-bottom:auto}
#ch button:hover,#ch button:focus-visible{background:var(--red);color:#fff;outline:0}
#sp.on{display:grid;place-content:center;background:#000b;z-index:4;animation:f .5s}
#sp small{letter-spacing:.4em;color:var(--gold);font-weight:700}#sp b{font:900 clamp(30px,9vw,56px)/1.2 system-ui}
#ti.on,#en.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:5;background:linear-gradient(#120d1acc,#120d1af0)}
h1{margin:0;background:#fff;border:6px solid var(--red);border-radius:10px;padding:6px 20px;font:900 clamp(30px,10vw,64px)/1 "Arial Black",system-ui;box-shadow:0 8px 0 var(--gold)}
h1 span{color:var(--blue)}h1 em{color:var(--red);font-style:normal}
h2{margin:0;font-size:clamp(26px,7vw,44px)}#ti p,#en p{margin:0;font-size:clamp(17px,4.5vw,24px);opacity:.92}small{opacity:.8}
.bt{background:var(--red);color:#fff;border:0;border-radius:99px;padding:12px 36px;font:800 18px system-ui;box-shadow:0 4px 0 #8c130d;cursor:pointer}
#box{position:relative;flex:none;min-height:clamp(140px,24vh,190px);margin:0 8px 8px;padding:20px 22px 26px;background:var(--paper);border:2px solid #fff;border-radius:16px;box-shadow:0 6px 24px #0008;cursor:pointer}
#nm{position:absolute;left:14px;top:-30px;background:var(--paper);padding:4px 26px 2px;border-radius:12px 12px 0 0;font:800 clamp(15px,3.8vw,20px)/1.5 system-ui;text-transform:uppercase;letter-spacing:.04em}
#tx{margin:0;font-size:clamp(16px,4.2vw,21px);font-weight:500}#tx.nar{font-style:italic;color:#5b4f68}
#ar{position:absolute;right:16px;bottom:8px;color:var(--red);font-style:normal;animation:b 1s infinite}
@keyframes b{50%{transform:translateX(4px)}}@keyframes f{from{opacity:0}}
#snd{position:absolute;top:8px;left:12px;z-index:6;background:#0008;color:#fff;border:0;border-radius:99px;padding:2px 12px;font-size:18px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
