<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Annabey Run</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070b;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}.g{position:fixed;inset:0;background:linear-gradient(#11182c,#171421 55%,#07080d)}canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.score{position:absolute;right:22px;top:20px;text-align:right;font:600 13px monospace;letter-spacing:.15em}.score small{display:block;color:#85899b;font-size:8px;letter-spacing:.25em}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.panel{padding:24px}.logo{font:400 clamp(44px,12vw,82px)/.9 Georgia,serif}.sub{margin-top:14px;color:#9ba0b0;font-size:10px;letter-spacing:.3em;text-transform:uppercase}.start{margin-top:28px;border:1px solid #fff2;background:#ffffff10;color:#fff;border-radius:999px;padding:13px 24px;font-size:10px;letter-spacing:.22em;text-transform:uppercase}.hint{margin-top:15px;color:#666b7c;font-size:9px;letter-spacing:.08em}.hide{display:none}.back{position:absolute;top:18px;left:18px;z-index:4;width:42px;height:42px;border-radius:50%;border:1px solid #fff2;background:#0006;color:#fff;font-size:20px;pointer-events:auto}.gameover h2{font:400 52px Georgia,serif;margin:12px 0}</style></head><body><div class="g"><canvas id="c"></canvas><div class="ui"><button class="back" onclick="history.back()">←</button><div class="score"><small>SCORE</small><span id="s">000000</span><small>BEST <b id="b">000000</b></small></div><div id="start" class="center"><div class="panel"><div class="logo">Annabey Run</div><div class="sub">just keep running ✦</div><button class="start" onclick="reset()">Tap to Run</button><div class="hint">TAP / SPACE — JUMP · DOUBLE TAP — DASH</div></div></div><div id="over" class="center hide"><div class="panel gameover"><div class="sub">RUN ENDED</div><h2 id="final">0</h2><button class="start" onclick="reset()">Run Again</button></div></div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,G,last=0,on=false,score=0,best=+localStorage.abBest||0,obs=[],stars=[],dust=[],spawn=0,ss=0,spd=7,lastTap=0,world=0;const p={x:82,y:0,w:34,h:46,vy:0,ground:true,dash:0};document.getElementById('b').textContent=String(best).padStart(6,'0');function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);G=H*.78;p.y=G-p.h}addEventListener('resize',size);size();function reset(){score=0;spd=7;obs=[];stars=[];dust=[];spawn=.5;ss=.7;world=0;p.y=G-p.h;p.vy=0;p.ground=true;p.dash=0;on=true;document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}function jump(){if(!on)return;if(p.ground){p.vy=-15;p.ground=false;burst(p.x+16,p.y+p.h,7)}else if(performance.now()-lastTap<260){p.dash=18;burst(p.x,p.y+23,14)}lastTap=performance.now()}function burst(a,b,n){for(let i=0;i<n;i++)dust.push({x:a,y:b,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,a:1})}function loop(t){if(!on)return;let dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}function update(dt){score+=dt*spd*8;spd=Math.min(15,spd+dt*.18);world+=dt;spawn-=dt;ss-=dt;if(spawn<=0){let h=28+Math.random()*34,w=18+Math.random()*22;obs.push({x:W+20,y:G-h,w,h});spawn=.65+Math.random()*.8}if(ss<=0){stars.push({x:W+15,y:G-70-Math.random()*140});ss=.45+Math.random()*.7}p.vy+=34*dt;p.y+=p.vy*dt;if(p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.ground=true}let m=p.dash>0?1.8:1;if(p.dash>0)p.dash-=dt*60;obs.forEach(o=>o.x-=spd*60*dt*m);stars.forEach(a=>a.x-=spd*60*dt*m);obs=obs.filter(o=>o.x+o.w>-40);stars=stars.filter(a=>a.x>-30);for(const o of obs)if(p.x+5<o.x+o.w&&p.x+p.w-5>o.x&&p.y+7<o.y+o.h&&p.y+p.h-4>o.y){end();return}for(let i=stars.length-1;i>=0;i--){let a=stars[i],dx=p.x+17-a.x,dy=p.y+23-a.y;if(dx*dx+dy*dy<900){score+=100;burst(a.x,a.y,10);stars.splice(i,1)}}dust.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=8*dt;q.a-=dt*2});dust=dust.filter(q=>q.a>0);document.getElementById('s').textContent=String(Math.floor(score)).padStart(6,'0')}function draw(){let q=Math.min(1,score/9000),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${12+18*q},${18+12*q},${40+35*q})`);g.addColorStop(1,`rgb(${6+8*q},${7+9*q},${13+20*q})`);x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<45;i++){let a=(i*113+score*.018)%W,b=(i*59)%(G*.72);x.fillStyle='#ffffff99';x.fillRect(a,b,1.4,1.4)}x.fillStyle='#ffffff18';x.fillRect(0,G,W,2);for(const a of stars){x.fillStyle='#f4e8ba';x.shadowBlur=14;x.shadowColor='#fff';x.beginPath();x.arc(a.x,a.y,5,0,7);x.fill();x.shadowBlur=0}for(const o of obs){x.fillStyle='#282c3a';x.beginPath();x.roundRect(o.x,o.y,o.w,o.h,7);x.fill();x.strokeStyle='#fff2';x.stroke()}x.save();x.translate(p.x,p.y);x.fillStyle='#eee9df';x.beginPath();x.roundRect(0,0,p.w,p.h,13);x.fill();x.fillStyle='#151720';x.beginPath();x.arc(23,15,3,0,7);x.fill();x.fillStyle='#bfb6a7';x.fillRect(7,43,7,7);x.fillRect(23,43,7,7);x.restore();for(const q of dust){x.globalAlpha=q.a;x.fillStyle='#f2e7c9';x.beginPath();x.arc(q.x,q.y,2.5,0,7);x.fill()}x.globalAlpha=1}function end(){on=false;best=Math.max(best,Math.floor(score));localStorage.abBest=best;document.getElementById('b').textContent=String(best).padStart(6,'0');document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hide')}addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});draw();
</script></body></html>
